[platformio]
src_dir = ../../examples/ESP32/ESP32OTACheck

[env]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
; Discover this checkout of Arduino-Library instead of a published release.
lib_extra_dirs = ../../..

[env:analog]
build_flags = -DOTA_CHECK_I2C=0

[env:i2c]
build_flags = -DOTA_CHECK_I2C=1
